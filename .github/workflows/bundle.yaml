name: bundle

on:
  push:
    tags:
      - '*'
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && pnpm build
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      # - name: Commit changes
      #   uses: EndBug/add-and-commit@v9.1.3
      #   with:
      #     default_author: github_actions
      #     message: '[bot] bundle'

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      # - id: autotag
      #   if: github.repository != 'StageDog/tavern_helper_template'
      #   uses: phish108/autotag-action@v1.1.64
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     with-v: true
      # - if: ${{ github.repository != 'StageDog/tavern_helper_template' && steps.autotag.outputs.tag != '0.0.0' && steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
      #   run: git push --delete origin ${{ steps.autotag.outputs.tag }}

      # 1. 检查 dist 文件夹是否存在且非空（容错判断）
      - name: Check if dist exists
        id: check_dist
        run: |
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "has_dist=true" >> $GITHUB_OUTPUT
          else
            echo "has_dist=false" >> $GITHUB_OUTPUT
            echo "Warning: dist folder is missing or empty. Skipping deployment."
          fi

      # 2. 仅在 dist 存在且非空时，将产物推送到 B 仓库的专属子目录
      - name: Deploy dist to B Repo
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        with:
          source-directory: 'dist'
          destination-github-username: 'nice-lsp'
          destination-repository-name: 'sillytavern-card-dist'
          user-email: 'github-actions[bot]@users.noreply.github.com'
          target-branch: 'main'
          target-directory: ${{ github.event.repository.name }}

      # 3. 仅在部署成功后，为 B 仓库自动生成并推送项目专属 Tag (如 highschool-of-the-dead-v1.0.1)
      - name: Tag release in B Repo
        if: steps.check_dist.outputs.has_dist == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
          B_REPO: 'nice-lsp/sillytavern-card-dist'
          PROJECT_NAME: ${{ github.event.repository.name }}
          A_TAG: ${{ github.ref_name }}
        run: |
          NEW_TAG="${PROJECT_NAME}-${A_TAG}"
          echo "New Tag for B Repo: $NEW_TAG"

          SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$B_REPO/commits/main" | jq -r '.sha')

          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$B_REPO/git/refs" \
            -d "{\"ref\": \"refs/tags/$NEW_TAG\", \"sha\": \"$SHA\"}"
